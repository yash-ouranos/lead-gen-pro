version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lead_gen_db
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      target: production
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Tell the app how to connect to the db container
      - DATABASE_URL=postgresql://postgres:password@db:5432/lead_gen_db?schema=public
    depends_on:
      - db

volumes:
  postgres_data:
